name: CI

# The pre-push hook runs lint:strict and type-check, but it lives on one
# machine and `--no-verify` skips it. This is the copy that actually gates a
# pull request.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if the lockfile and package.json disagree.
      - run: npm ci

      - name: Lint
        run: npm run lint:strict

      - name: Typecheck
        run: npm run type-check

      # `npm test` chains every unit suite, so a new suite is picked up by
      # adding it there rather than here. e2e and the campaign scripts are
      # excluded: they need a running app and a signed-in session.
      - name: Unit tests
        run: npm test

      # Copy-paste guard (audit §10). The threshold is today's level (1.4%
      # duplicated lines); lower it as the 9a duplicates are merged.
      - name: Duplicate code
        run: npm run dup:check

      # Unused files, exports and dependencies. Reported, not yet blocking:
      # the backlog is cleared first, then `continue-on-error` comes off.
      - name: Dead code
        run: npm run deadcode
        continue-on-error: true

      # Known vulnerabilities in production dependencies. Reported, not blocking:
      # some advisories have no upstream fix yet; Dependabot raises the bumps.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
